name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: Swift package (macOS)
    runs-on: [tartelet]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests
        run: swift test --no-parallel

      - name: Build release
        run: swift build -c release

  linux:
    name: Swift package (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests
        run: swift test --no-parallel

      - name: Build release
        run: swift build -c release
