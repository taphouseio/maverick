[env]
CONTAINER = "ghcr.io/taphouseio/maverick"

# Development tasks
[tasks.dev]
description = "Download the dev site (jsorge.net) into _dev/"
run = "./tools/update_dev.sh"

[tasks.run]
description = "Run Maverick locally via swift run"
run = "swift run Maverick serve --env development --hostname 127.0.0.1 --port 8080"

[tasks.broadcast-dev-setup]
description = "Configure _dev for encrypted local broadcaster testing"
run = "bash tools/setup_broadcast_dev.sh"

[tasks.broadcast-dev]
description = "Configure and run the local post broadcaster"
run = """
bash tools/setup_broadcast_dev.sh
dev_port="${MAVERICK_DEV_PORT:-8080}"
MAVERICK_SECRETS_DIRECTORY="$PWD/_dev/.maverick-secrets" \
  swift run Maverick serve --env development --hostname 127.0.0.1 --port "$dev_port"
"""

[tasks.docker-dev]
description = "Build & run in Docker with nginx (http://localhost:8080)"
run = """
cp tools/docker-compose_local.yml _dev/.tools/docker-compose_local.yml
cd _dev/.tools && docker-compose -f docker-compose_local.yml up --build
"""

[tasks.docker-dev-down]
description = "Stop Docker dev containers"
run = "cd _dev/.tools && docker-compose -f docker-compose_local.yml down"

# Release tasks
[tasks.release]
description = "Interactive release: prompts for version, then tags, builds, and pushes"
run = "bash mise/scripts/release.sh"

[tasks.docker-build]
description = "Build Docker image. Usage: mise run docker-build [VERSION]"
run = "bash mise/scripts/docker-build.sh"

[tasks.docker-smoke-test]
description = "Verify the production image. Usage: mise run docker-smoke-test [IMAGE]"
run = "bash mise/scripts/docker-smoke-test.sh"

[tasks.container-build]
description = "Build the production image locally with Apple Container. Usage: mise run container-build [VERSION]"
run = "bash mise/scripts/container-build.sh"

[tasks.docker-push]
description = "Push Docker image. Usage: mise run docker-push [VERSION]"
run = "bash mise/scripts/docker-push.sh"
